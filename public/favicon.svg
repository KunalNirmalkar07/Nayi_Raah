<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#259c90" /> <!-- Primary Teal -->
      <stop offset="100%" stop-color="#18528c" /> <!-- Secondary Deep Navy -->
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Smooth background squirle -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)" />
  
  <!-- Content with slight shadow -->
  <g filter="url(#shadow)">
    <!-- Inner rings -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="24" opacity="0.9" />
    <circle cx="256" cy="256" r="100" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="24 16" opacity="0.3" />
    
    <!-- Compass markers -->
    <path d="M256 60 L256 110 M452 256 L402 256 M256 452 L256 402 M60 256 L110 256" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    
    <!-- Compass Needle (North -> White, South -> Accent) -->
    <path d="M256 120 L296 256 L256 256 Z" fill="#ffffff" />
    <path d="M256 120 L216 256 L256 256 Z" fill="#e2e8f0" />
    
    <path d="M256 392 L296 256 L256 256 Z" fill="#f59e0b" /> <!-- Accent Gold -->
    <path d="M256 392 L216 256 L256 256 Z" fill="#d97706" />
    
    <!-- Center node -->
    <circle cx="256" cy="256" r="32" fill="#ffffff" />
    <circle cx="256" cy="256" r="14" fill="#259c90" />
  </g>
</svg>
